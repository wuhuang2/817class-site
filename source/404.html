<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="您访问的资源未能找到 | 404 | Tunliu District No.1 Middle School Class 817 Information Portal">
<meta name="robots" content="noindex">
<title>404 | Tunliu District No.1 Middle School Class 817 Information Portal</title>

<style>
  :root {
    --bg: #f7f8fa;
    --fg: #2c3038;
    --muted: #5c6370;
    --accent: #3b6ea5;
    --accent-hover: #2b5580;
    --footer-bg: #eceef1;
    --footer-fg: #5c6370;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --fg: #e6e8ec;
      --muted: #9aa1ad;
      --accent: #7fa9d6;
      --accent-hover: #a3c4e8;
      --footer-bg: #101216;
      --footer-fg: #9aa1ad;
    }
  }

  * { box-sizing: border-box; }

  html { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  /* Respect notches / rounded corners / home indicator on phones */
  .site-header {
    padding: 20px 24px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-left: calc(24px + env(safe-area-inset-left, 0px));
    padding-right: calc(24px + env(safe-area-inset-right, 0px));
  }

  .site-title {
    display: inline-block;
    font-size: 15px;
    font-weight: 600;
    color: var(--fg);
    text-decoration: none;
    letter-spacing: .01em;
    /* Comfortable tap target without changing the visual size */
    padding: 6px 0;
    margin: -6px 0;
  }

  .site-title:hover { color: var(--accent); }

  /* Main 404 block — takes the leftover space so the footer stays at the
     bottom on tall screens, and grows naturally on short ones. */
  main {
    position: relative;
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 72px;
    overflow: hidden;
  }

  /* dvh avoids the iOS Safari toolbar jump; harmless elsewhere. */
  @supports (height: 100dvh) {
    body { min-height: 100dvh; }
  }

  /* --- Mascot: line-art owl, watermark behind the copy --- */
  .owl-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(78vw, 520px);
    max-width: 100%;
    height: auto;
    color: var(--fg);
    opacity: .07;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  .not-found {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  /* Compact owl above the copy on narrow screens */
  .owl-inline {
    display: none;
    width: 108px;
    height: auto;
    margin: 0 auto 20px;
    color: var(--fg);
    opacity: .28;
  }

  .not-found-code {
    font-size: 13px;
    font-style: italic;
    letter-spacing: .18em;
    color: var(--muted);
    opacity: .8;
    margin-bottom: 12px;
  }

  .not-found-hint {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.35;
    margin: 0 0 24px;
    /* Never let a long CJK line force the page wider than the viewport */
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .not-found-text {
    font-size: 15px;
    color: var(--muted);
    margin: 0 0 40px;
    overflow-wrap: anywhere;
  }

  .not-found-links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .not-found-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;          /* touch target */
    padding: 10px 22px;
    font-size: 15px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid currentColor;
    border-radius: 6px;
    transition: background-color .15s ease, color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .not-found-link:hover,
  .not-found-link:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .site-footer {
    flex-shrink: 0;
    padding: 20px 24px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--footer-bg);
    color: var(--footer-fg);
    font-size: 12px;
    line-height: 1.65;
    text-align: center;
  }

  .site-footer p { margin: 0 0 6px; }
  .site-footer p:last-child { margin-bottom: 0; }
  .site-footer a { color: var(--accent); text-decoration: none; }
  .site-footer a:hover { text-decoration: underline; }

  /* ---------- Tablet ---------- */
  @media (max-width: 768px) {
    main { padding: 36px 24px 48px; }
    .owl-bg { width: min(70vw, 420px); }
    .not-found-hint { font-size: 26px; }
  }

  /* ---------- Phone ---------- */
  @media (max-width: 480px) {
    .site-header { padding: 16px 20px; }
    .site-header {
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      padding-left: calc(20px + env(safe-area-inset-left, 0px));
      padding-right: calc(20px + env(safe-area-inset-right, 0px));
    }
    .site-title { font-size: 14px; }

    main { padding: 24px 20px 32px; }

    .owl-bg { display: none; }
    .owl-inline { display: block; width: 92px; margin-bottom: 16px; }

    .not-found-code { font-size: 12px; margin-bottom: 10px; }

    .not-found-hint {
      font-size: 22px;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .not-found-text {
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
      padding: 0 4px;
    }

    /* Full-width stacked buttons read better than two cramped pills */
    .not-found-links { gap: 10px; }
    .not-found-link {
      flex: 1 1 100%;
      max-width: 320px;
      font-size: 16px;
      padding: 12px 20px;
    }

    .site-footer { font-size: 11px; padding: 16px 20px; }
  }

  /* ---------- Very short viewports (landscape phones) ---------- */
  @media (max-height: 520px) {
    main { align-items: flex-start; padding-top: 12px; padding-bottom: 24px; }
    .owl-bg { display: none; }
    .owl-inline { width: 72px; margin-bottom: 12px; }
    .not-found-hint { font-size: 20px; margin-bottom: 12px; }
    .not-found-text { margin-bottom: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .not-found-link { transition: none; }
  }
</style>
</head>

<body>
  <header class="site-header">
    <a class="site-title" href="/">屯留一中817班</a>
  </header>

  <main>
    <!-- Mascot: line-art owl. Defined once, reused by <use> at two sizes. -->
    <svg class="owl-bg" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
      <defs>
        <g id="owl-glyph" fill="none" stroke="currentColor"
           stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <!-- head + body outline -->
          <path d="M72 44 C72 26 82 16 100 16 C118 16 128 26 128 44
                   C144 54 152 72 152 94 C152 132 129 158 100 158
                   C71 158 48 132 48 94 C48 72 56 54 72 44 Z" />
          <!-- brow tufts -->
          <path d="M72 44 L62 26 L82 34" />
          <path d="M128 44 L138 26 L118 34" />
          <!-- eye discs -->
          <circle cx="80" cy="72" r="19" />
          <circle cx="120" cy="72" r="19" />
          <!-- pupils -->
          <circle cx="80" cy="72" r="5" fill="currentColor" stroke="none" />
          <circle cx="120" cy="72" r="5" fill="currentColor" stroke="none" />
          <!-- beak -->
          <path d="M100 83 L110 95 L100 107 L90 95 Z" />
          <!-- wing feathers -->
          <path d="M57 100 q-9 14 -5 28" />
          <path d="M143 100 q9 14 5 28" />
          <!-- feet -->
          <path d="M88 158 L88 168 M80 168 L96 168" />
          <path d="M112 158 L112 168 M104 168 L120 168" />
        </g>
      </defs>
      <use href="#owl-glyph" xlink:href="#owl-glyph" />
    </svg>

    <div class="not-found">
      <svg class="owl-inline" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <use href="#owl-glyph" xlink:href="#owl-glyph" />
      </svg>

      <div class="not-found-code">404 NOT FOUND</div>

      <h1 class="not-found-hint">
        呜呜，小猎豹被猫头鹰吃掉了。
      </h1>

      <p class="not-found-text">
        如果你确信这里应该有些什么，请联系管理员。
      </p>

      <div class="not-found-links">
        <a class="not-found-link" href="/">返回主页</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 屯留一中817班 | Tunliu District No.1 Middle School Class 817 Information Portal</p>
    <p>Powered by <a href="https://pages.cloudflare.com/" target="_blank" rel="noopener nofollow">Cloudflare Pages</a> | Theme: <a href="https://hexo.io" target="_blank" rel="noopener nofollow">Hexo</a> ♡ <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="noopener nofollow">Fluid</a></p>
  </footer>
</body>
</html>
